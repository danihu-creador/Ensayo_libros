# Base de datos H2 en memoria (se borra al parar la aplicación)
spring.datasource.url=jdbc:h2:mem:libros
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las clases @Entity y muestra el SQL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Carga los datos de ejemplo de data.sql DESPUÉS de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola de la base de datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true

server.port=8080
